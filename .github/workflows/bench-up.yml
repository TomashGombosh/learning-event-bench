name: bench-up

on:
  workflow_dispatch:
    inputs:
      instance_type:
        description: EC2 instance type
        default: c7g.4xlarge
        type: string
      profile:
        description: smoke (~1h) then kafka-rerun, then full. Default never starts the long run.
        type: choice
        options:
          - smoke
          - kafka-rerun
          - full
        default: smoke
      bench_reps:
        description: Repetitions per cell when profile=full (5 includes plain kafka and C at L2500). Ignored for smoke and kafka-rerun.
        default: "5"
        type: string
      bench_duration_s:
        description: Measurement window in seconds when profile=full. Smoke is 60s.
        default: "240"
        type: string
  # Optional: weekly start (Saturday 20:00 UTC). Uncomment to enable.
  # schedule:
  #   - cron: "0 20 * * 6"

permissions:
  id-token: write
  contents: read

concurrency:
  group: bench-infra
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  TF_IN_AUTOMATION: "1"

jobs:
  up:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - name: Debug OIDC role
        run: |
          echo "Role: ${{ vars.AWS_ROLE_ARN }}"
          echo "Expected OIDC sub: repo:${{ github.repository }}:ref:${{ github.ref }}"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: bench-up-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.3

      - name: Terraform init (remote state)
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=bench/terraform.tfstate"
          -backend-config="region=${AWS_REGION}"

      - name: Refuse to start if a bench instance already exists
        run: |
          if terraform state list 2>/dev/null | grep -q '^aws_instance.bench$'; then
            echo "::error::A bench instance already exists in state. Run bench-down first."
            exit 1
          fi

      - name: Export Terraform variables
        env:
          INSTANCE_TYPE: ${{ inputs.instance_type || 'c7g.4xlarge' }}
          PROFILE: ${{ inputs.profile || 'smoke' }}
          BENCH_REPS: ${{ inputs.bench_reps || '5' }}
          BENCH_DURATION_S: ${{ inputs.bench_duration_s || '240' }}
          RESULTS_BUCKET: ${{ vars.RESULTS_BUCKET }}
          PERMISSIONS_BOUNDARY_ARN: ${{ vars.PERMISSIONS_BOUNDARY_ARN }}
        run: |
          # terraform import loads the whole configuration, so results_bucket and run_id
          # are required even though the log group resource does not use them.
          # One export feeds import, apply, and any later terraform command in this job.
          RUN_ID="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}"
          case "$PROFILE" in
            full)
              REPS="$BENCH_REPS"
              DURATION="$BENCH_DURATION_S"
              ;;
            kafka-rerun)
              REPS=1
              DURATION="$BENCH_DURATION_S"
              ;;
            *)
              PROFILE=smoke
              REPS=1
              DURATION=60
              ;;
          esac
          {
            echo "RUN_ID=${RUN_ID}"
            echo "TF_VAR_region=${AWS_REGION}"
            echo "TF_VAR_instance_type=${INSTANCE_TYPE}"
            echo "TF_VAR_results_bucket=${RESULTS_BUCKET}"
            echo "TF_VAR_permissions_boundary_arn=${PERMISSIONS_BOUNDARY_ARN}"
            echo "TF_VAR_run_id=${RUN_ID}"
            echo "TF_VAR_git_ref=${GITHUB_SHA}"
            echo "TF_VAR_bench_profile=${PROFILE}"
            echo "TF_VAR_bench_reps=${REPS}"
            echo "TF_VAR_bench_duration_s=${DURATION}"
            echo "TF_VAR_max_runtime_minutes=2460"
          } >> "$GITHUB_ENV"
          echo "profile=$PROFILE reps=$REPS duration_s=$DURATION run_id=$RUN_ID"

      - name: Import the persistent log group when it already exists
        run: |
          if aws logs describe-log-groups --log-group-name-prefix /leb/bench \
              --query "logGroups[?logGroupName=='/leb/bench'] | length(@)" --output text | grep -qx 1; then
            if ! terraform state list 2>/dev/null | grep -qx 'aws_cloudwatch_log_group.bench'; then
              terraform import -input=false aws_cloudwatch_log_group.bench /leb/bench
            fi
          fi

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve

      - name: Summary
        run: |
          {
            echo "### Bench started"
            echo "- profile: \`${{ inputs.profile || 'smoke' }}\`"
            echo "- run id: \`${RUN_ID}\`"
            echo "- instance: \`$(terraform output -raw instance_id)\` ($(terraform output -raw architecture))"
            echo "- created at: $(terraform output -raw created_at)"
            echo "- results: $(terraform output -raw results_prefix)"
            echo "- automatic destroy by bench-down after 41 h (instance self-terminates at 41 h as well)"
          } >> "$GITHUB_STEP_SUMMARY"
