name: bench-down

on:
  schedule:
    - cron: "17 * * * *" # hourly check
  workflow_dispatch:
    inputs:
      force:
        description: Destroy now regardless of age
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: bench-infra
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  MAX_AGE_HOURS: "41"
  TF_IN_AUTOMATION: "1"
  # destroy loads the configuration. results_bucket and run_id have no default.
  # The real run id is already in state; destroy addresses resources by id.
  TF_VAR_region: ${{ vars.AWS_REGION || 'eu-central-1' }}
  TF_VAR_results_bucket: ${{ vars.RESULTS_BUCKET }}
  TF_VAR_permissions_boundary_arn: ${{ vars.PERMISSIONS_BOUNDARY_ARN }}
  TF_VAR_run_id: destroy

jobs:
  down:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: bench-down-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false

      - name: Terraform init (remote state)
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=bench/terraform.tfstate"
          -backend-config="region=${AWS_REGION}"

      - name: Decide
        id: decide
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          if ! terraform state list 2>/dev/null | grep -q '^aws_instance.bench$'; then
            echo "No bench infrastructure in state."; echo "destroy=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          INSTANCE_ID=$(terraform output -raw instance_id)
          CREATED=$(terraform output -raw created_at)
          STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text 2>/dev/null || echo missing)
          AGE_H=$(( ( $(date -u +%s) - $(date -u -d "$CREATED" +%s) ) / 3600 ))
          echo "instance=$INSTANCE_ID state=$STATE created=$CREATED age=${AGE_H}h force=$FORCE"
          if [ "$FORCE" = "true" ] || [ "$AGE_H" -ge "$MAX_AGE_HOURS" ] \
             || [ "$STATE" = "terminated" ] || [ "$STATE" = "shutting-down" ] || [ "$STATE" = "stopped" ] || [ "$STATE" = "missing" ]; then
            echo "destroy=true" >> "$GITHUB_OUTPUT"
          else
            echo "destroy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Terraform destroy
        if: steps.decide.outputs.destroy == 'true'
        run: |
          # /leb/bench has prevent_destroy. Drop it from state first: a destroy that
          # still tracks the group fails closed on prevent_destroy, and a destroy
          # after state rm does not plan the group at all. The next bench-up imports it.
          terraform state rm aws_cloudwatch_log_group.bench || true
          terraform destroy -input=false -auto-approve
          echo "### Bench infrastructure destroyed" >> "$GITHUB_STEP_SUMMARY"
