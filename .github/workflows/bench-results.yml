name: bench-results

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run id (folder under s3://<results-bucket>/runs/); empty = latest
        type: string
        default: ""
      base_run_id:
        description: Only for a profile=cells rerun. The earlier run whose cells it replaces (e.g. 20261018T110200Z-c440945); empty = analyse run_id alone
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}

jobs:
  analyse:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: bench-results-${{ github.run_id }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download and analyse
        env:
          RESULTS_BUCKET: ${{ vars.RESULTS_BUCKET }}
          RUN_ID: ${{ inputs.run_id }}
          BASE_RUN_ID: ${{ inputs.base_run_id }}
        run: |
          pip install -q -r analysis/requirements.txt
          ./experiments/fetch_results.sh "$RUN_ID"

      - uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: |
            results/_analysis/
            results/run-metadata.json
            results/matrix.csv
            results/run.log
            results/rerun-run.log
            results/merged-from.json
            results/validity.json
            results/*/shard-*/summary.json
            results/*/gateways.log
          if-no-files-found: warn
